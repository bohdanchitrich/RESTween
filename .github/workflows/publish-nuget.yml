name: Publish NuGet packages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      CONFIGURATION: Release
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x

      - name: Validate package versions
        shell: bash
        run: |
          projects=(
            "RESTween.Core/RESTween.Core.csproj"
            "RESTween/RESTween.csproj"
            "RESTWeen.Server/RESTween.Server.csproj"
          )

          expected_version=""

          for project in "${projects[@]}"; do
            package_id="$(dotnet msbuild "$project" -getProperty:PackageId)"
            version="$(dotnet msbuild "$project" -getProperty:PackageVersion)"

            if [[ -z "$version" ]]; then
              version="$(dotnet msbuild "$project" -getProperty:Version)"
            fi

            if [[ ! "$version" =~ ^[0-9]+[.][0-9]+[.][0-9]+([-][0-9A-Za-z.-]+)?([+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Invalid package version in $project: $version"
              exit 1
            fi

            if [[ -z "$expected_version" ]]; then
              expected_version="$version"
            elif [[ "$version" != "$expected_version" ]]; then
              echo "Package versions must match. Expected $expected_version, but $project has $version."
              exit 1
            fi

            echo "$package_id $version"

            package_id_lower="$(echo "$package_id" | tr '[:upper:]' '[:lower:]')"
            version_lower="$(echo "$version" | tr '[:upper:]' '[:lower:]')"
            index_url="https://api.nuget.org/v3-flatcontainer/$package_id_lower/index.json"
            response_file="$(mktemp)"
            http_code="$(curl --silent --show-error --location --output "$response_file" --write-out "%{http_code}" "$index_url")"

            if [[ "$http_code" == "200" ]]; then
              if grep -F "\"$version_lower\"" "$response_file" > /dev/null; then
                echo "$package_id $version is already published on NuGet."
                exit 1
              fi
            elif [[ "$http_code" == "404" ]]; then
              echo "$package_id has no published versions yet."
            else
              echo "Failed to check $package_id on NuGet. HTTP status: $http_code"
              cat "$response_file"
              exit 1
            fi

            rm "$response_file"
          done

          echo "All packages use version $expected_version and it is not published yet."

      - name: Restore
        shell: bash
        run: |
          dotnet restore RESTween.Core/RESTween.Core.csproj /p:NuGetAudit=false
          dotnet restore RESTween/RESTween.csproj /p:NuGetAudit=false
          dotnet restore RESTWeen.Server/RESTween.Server.csproj /p:NuGetAudit=false
          dotnet restore Tests/Tests.csproj /p:NuGetAudit=false
          dotnet restore RESTween.Server.Tests/RESTween.Server.Tests.csproj /p:NuGetAudit=false

      - name: Build packages
        shell: bash
        run: |
          dotnet build RESTween.Core/RESTween.Core.csproj --configuration "$CONFIGURATION" --no-restore -m:1 /p:GeneratePackageOnBuild=false /p:NuGetAudit=false
          dotnet build RESTween/RESTween.csproj --configuration "$CONFIGURATION" --no-restore -m:1 /p:GeneratePackageOnBuild=false /p:NuGetAudit=false
          dotnet build RESTWeen.Server/RESTween.Server.csproj --configuration "$CONFIGURATION" --no-restore -m:1 /p:GeneratePackageOnBuild=false /p:NuGetAudit=false

      - name: Test
        shell: bash
        run: |
          dotnet test Tests/Tests.csproj --configuration "$CONFIGURATION" --no-restore -m:1 --verbosity normal /p:NuGetAudit=false
          dotnet test RESTween.Server.Tests/RESTween.Server.Tests.csproj --configuration "$CONFIGURATION" --no-restore -m:1 --verbosity normal /p:NuGetAudit=false

      - name: Pack RESTween.Core
        run: dotnet pack RESTween.Core/RESTween.Core.csproj --configuration "$CONFIGURATION" --no-build --no-restore --output artifacts /p:NuGetAudit=false

      - name: Pack RESTween
        run: dotnet pack RESTween/RESTween.csproj --configuration "$CONFIGURATION" --no-build --no-restore --output artifacts /p:NuGetAudit=false

      - name: Pack RESTween.Server
        run: dotnet pack RESTWeen.Server/RESTween.Server.csproj --configuration "$CONFIGURATION" --no-build --no-restore --output artifacts /p:NuGetAudit=false

      - name: Publish packages
        shell: bash
        run: |
          for package in artifacts/*.nupkg; do
            dotnet nuget push "$package" --api-key "${{ secrets.NUGET_API_KEY }}" --source "$NUGET_SOURCE" --skip-duplicate
          done
